[project]
name = "loopctl"
version = "0.1.0"
description = "A control plane for long-running AI coding work"
readme = "README.md"

# 3.14, not 3.12 -- reversed from the original plan on 2026-08-02. uv's own
# managed interpreters (3.12, and a pre-existing 3.11) are blocked on this
# machine by Windows Application Control; only the officially-installed system
# 3.14 executes. Before pinning to it we verified the full dependency set
# (LangGraph, anthropic, claude-agent-sdk, FastAPI, ...) actually installs and
# imports on 3.14 -- it does, cleanly, no source builds. If your machine can
# run a uv-managed 3.12 (`uv python install 3.12` succeeds), you may prefer
# that instead; nothing in the code depends on the specific 3.1x/3.14 choice.
requires-python = ">=3.14,<3.15"

# Version floors are intentionally absent: run `uv add <pkg>` for each of these
# so uv resolves and pins current versions into uv.lock. Commit the lockfile --
# a run you cannot reproduce is not evidence of anything.
dependencies = [
    "langgraph",                    # graph executor: interrupt() = human gate
    "langgraph-checkpoint-sqlite",  # pause / resume / crash recovery
    "anthropic",                    # Messages API: criteria, planning, judge
    "claude-agent-sdk",             # the execution agent's harness
    "pydantic",                     # contracts, shared with OpenAPI + output_format
    "pydantic-settings",            # config.py
    "fastapi",
    "uvicorn[standard]",
    "typer",                        # CLI: headless runs, CI, demos without the UI
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[project.scripts]
loopctl = "loopctl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# This is the one line that changed on the move from engine/pyproject.toml to
# here: the package still physically lives under engine/src/loopctl -- moving
# the tooling to the root did not move the code, and it doesn't need to.
[tool.hatch.build.targets.wheel]
packages = ["engine/src/loopctl"]

[tool.ruff]
line-length = 100
src = ["engine/src", "engine/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["engine/src", "engine/tests"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
addopts = "-q"
asyncio_mode = "auto"
