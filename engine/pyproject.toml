[project]
name = "loopctl"
version = "0.1.0"
description = "A control plane for long-running AI coding work"
readme = "../README.md"

# 3.12, deliberately. The machine has 3.14 installed, but LangGraph and much of
# the surrounding ecosystem do not ship wheels for it yet -- building those C
# extensions from source is a day you do not have. `uv python install 3.12`
# fetches its own interpreter and leaves your system Python alone.
requires-python = ">=3.12,<3.13"

# Version floors are intentionally absent: run `uv add <pkg>` for each of these
# so uv resolves and pins current versions into uv.lock. Commit the lockfile --
# a run you cannot reproduce is not evidence of anything.
dependencies = [
    "langgraph",                    # graph executor: interrupt() = human gate
    "langgraph-checkpoint-sqlite",  # pause / resume / crash recovery
    "anthropic",                    # Messages API: criteria, planning, judge
    "claude-agent-sdk",             # the execution agent's harness
    "pydantic",                     # contracts, shared with OpenAPI + output_format
    "pydantic-settings",            # config.py
    "fastapi",
    "uvicorn[standard]",
    "typer",                        # CLI: headless runs, CI, demos without the UI
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[project.scripts]
loopctl = "loopctl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopctl"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
